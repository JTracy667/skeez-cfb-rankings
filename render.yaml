services:
  - type: web
    name: skeez-cfb-rankings
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CFBD_API_KEY
        sync: false  # set manually in dashboard
      - key: PROPLINE_API_KEY
        sync: false
      - key: THE_ODDS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://skeezcfb-rankings.com
