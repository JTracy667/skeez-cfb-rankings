<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skeez CFB Rankings — Weekly Schedule</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3348;
  --text:#e4e6f0;--text-dim:#8b8fa8;--accent:#4f8cff;--accent-glow:rgba(79,140,255,0.15);
  --up:#34d399;--down:#f87171;--top3:#fbbf24;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.header{background:linear-gradient(135deg,#1a1d27 0%,#0f1117 100%);border-bottom:1px solid var(--border);padding:2rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 50% 80%,var(--accent-glow) 0%,transparent 50%);pointer-events:none}
.header h1{font-size:2.25rem;font-weight:900;letter-spacing:-0.03em;position:relative}
.header h1 span{color:var(--accent)}
.header .subtitle{color:var(--text-dim);font-size:.95rem;margin-top:.35rem;position:relative}
.week-badge{display:inline-block;margin-top:1rem;background:var(--surface2);border:1px solid var(--border);padding:.35rem 1rem;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--accent);position:relative}
nav{margin-top:1rem;position:relative;display:flex;gap:12px;justify-content:center}
nav a{color:var(--text-dim);text-decoration:none;font-size:.85rem;font-weight:600;transition:color .2s}
nav a:hover{color:var(--accent)}
nav a.active{color:var(--accent)}
.container{max-width:1200px;margin:0 auto;padding:24px}
.controls{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1.5rem}
.search-box{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.6rem 1rem;color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s}
.search-box:focus{border-color:var(--accent)}
.filter-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.6rem 1rem;color:var(--text-dim);font-size:.85rem;font-weight:500;cursor:pointer;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.refresh-btn{background:var(--accent);border:none;border-radius:10px;padding:.6rem 1.2rem;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .2s}
.refresh-btn:hover{opacity:.85}
.matchup-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;transition:border-color .2s,transform .15s}
.matchup-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.team-side{display:flex;align-items:center;gap:.75rem}
.team-side.away{justify-content:flex-end;text-align:right}
.team-logo{width:60px;height:60px;border-radius:10px;overflow:hidden;flex-shrink:0;border:1px solid var(--border)}
.team-logo img{width:100%;height:100%;object-fit:contain;background:var(--surface2)}
.team-name{font-weight:700;font-size:1.25rem}
.team-meta{font-size:.95rem;color:var(--text-dim);display:flex;gap:.5rem;align-items:center}
.team-side.away .team-meta{flex-direction:row-reverse}
.vs-section{text-align:center;min-width:120px}
.vs-label{font-size:.75rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.vs-score{font-size:1.5rem;font-weight:800;margin:.25rem 0;font-variant-numeric:tabular-nums}
.vs-score.home{color:var(--accent)}
.vs-score.away{color:var(--text-dim)}
.diff-badge{display:inline-block;padding:.2rem .6rem;border-radius:6px;font-size:.75rem;font-weight:700;margin-top:.25rem}
.diff-badge.home-fav{background:rgba(79,140,255,.15);color:var(--accent)}
.diff-badge.away-fav{background:rgba(248,113,113,.15);color:var(--down)}
.diff-badge.pick-em{background:rgba(251,191,36,.15);color:var(--top3)}
.line-overlay{display:flex;gap:.35rem;justify-content:center;margin:0.25rem 0;font-size:0.72rem}
.line-spread{font-weight:600;color:var(--accent);background:rgba(79,140,255,.1);padding:0.1rem 0.5rem;border-radius:4px}
.line-total{color:var(--text-dim)}
.line-na{color:var(--text-dim);font-style:italic}
.line-vs-model{font-size:0.68rem;font-weight:500;padding:0.1rem 0.4rem;border-radius:4px}
.line-vs-model.up{color:var(--up);background:rgba(52,221,177,.1)}
.line-vs-model.down{color:var(--down);background:rgba(248,113,113,.1)}
.game-date{font-size:0.68rem;color:var(--text-dim);margin:0.2rem 0;font-weight:500}
.sp-row{display:flex;gap:.5rem;align-items:center;font-size:.72rem;color:var(--text-dim);margin-top:.2rem}
.sp-val{font-weight:600}
.sp-val.high{color:var(--up)}
.sp-val.low{color:var(--down)}
.summary-row{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-bottom:1.5rem}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center}
.summary-card .val{font-size:1.75rem;font-weight:800;color:var(--accent)}
.summary-card .label{font-size:.75rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:.25rem}
.summary-card.record .val{font-variant-numeric:tabular-nums}
.summary-card.record .val.good{color:var(--up)}
.pick-arrow{font-weight:800;color:var(--up);font-size:1.1rem;margin:0 4px;flex-shrink:0;text-shadow:0 0 8px rgba(52,211,153,0.4)}
.ou-pick{font-size:0.7rem;font-weight:600;padding:0.15rem 0.5rem;border-radius:4px;margin-top:0.2rem}
.ou-pick.up{color:var(--up);background:rgba(52,211,177,.1)}
.ou-pick.down{color:var(--down);background:rgba(248,113,113,.1)}
.best-bets{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.5rem}
.best-bets h3{font-size:1rem;font-weight:700;margin-bottom:.75rem;color:var(--accent)}
.best-bets .bb-row{display:grid;grid-template-columns:1.4fr auto auto;gap:.75rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.85rem}
.best-bets .bb-row:last-child{border-bottom:none}
.best-bets .bb-teams{font-weight:600}
.best-bets .bb-pick{font-weight:700;color:var(--up)}
.best-bets .bb-pick.under{color:var(--down)}
.best-bets .bb-stars{color:var(--top3);letter-spacing:1px}
.best-bets .bb-edge{color:var(--text-dim);font-size:.75rem}
.line-moves{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.5rem}
.line-moves h3{font-size:1rem;font-weight:700;margin-bottom:.75rem;color:var(--accent)}
.line-moves .lm-row{display:grid;grid-template-columns:1.4fr auto auto auto;gap:.75rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.85rem}
.line-moves .lm-row:last-child{border-bottom:none}
.line-moves .lm-teams{font-weight:600}
.line-moves .lm-market{color:var(--text-dim);text-transform:uppercase;font-size:.7rem;letter-spacing:.05em}
.line-moves .lm-delta{font-weight:700}
.line-moves .lm-delta.up{color:var(--up)}
.line-moves .lm-delta.down{color:var(--down)}
.line-moves .lm-empty{color:var(--text-dim);font-size:.85rem;padding:.5rem 0}
.footer{text-align:center;padding:1.5rem;color:var(--text-dim);font-size:.75rem;border-top:1px solid var(--border)}
@media(max-width:768px){
  .matchup-card{grid-template-columns:1fr;gap:.5rem;text-align:center}
  .team-side,.team-side.away{justify-content:center;text-align:center}
  .team-side.away .team-meta{flex-direction:row}
  .summary-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="header">
  <h1>🏈 Skeez <span>CFB Rankings</span> — Weekly Schedule</h1>
  <p class="subtitle">Score differentials and matchup projections</p>
  <div class="week-badge" id="weekBadge">Loading...</div>
  <nav>
    <a href="/">Skeez CFB Rankings</a>
    <span>·</span>
    <a href="/analytics">Analytics</a>
    <span>·</span>
    <a class="active">Schedule</a>
    <span>·</span>
    <a href="/win-totals">Win Totals</a>
  </nav>
</div>
<div class="container">
  <div class="summary-row" id="summaryRow"></div>
  <div class="best-bets" id="bestBets"></div>
  <div class="line-moves" id="lineMoves"></div>
  <div class="controls">
    <input type="text" class="search-box" id="searchBox" placeholder="Search teams...">
    <button class="filter-btn active" data-conf="all">All</button>
    <button class="filter-btn" data-conf="SEC">SEC</button>
    <button class="filter-btn" data-conf="Big Ten">Big Ten</button>
    <button class="filter-btn" data-conf="Big 12">Big 12</button>
    <button class="filter-btn" data-conf="ACC">ACC</button>
    <button class="filter-btn" data-conf="Pac-12">Pac-12</button>
    <button class="filter-btn" data-conf="American Athletic">AAC</button>
    <button class="filter-btn" data-conf="Conference USA">C-USA</button>
    <button class="filter-btn" data-conf="MAC">MAC</button>
    <button class="filter-btn" data-conf="Mountain West">MW</button>
    <button class="filter-btn" data-conf="Sun Belt">Sun Belt</button>
    <select class="filter-btn" id="weekSelect" title="Select week">
      <option value="1">Week 1</option>
      <option value="2">Week 2</option>
      <option value="3">Week 3</option>
      <option value="4">Week 4</option>
      <option value="5">Week 5</option>
      <option value="6">Week 6</option>
      <option value="7">Week 7</option>
      <option value="8">Week 8</option>
      <option value="9">Week 9</option>
      <option value="10">Week 10</option>
      <option value="11">Week 11</option>
      <option value="12">Week 12</option>
      <option value="13">Week 13</option>
      <option value="14">Week 14</option>
      <option value="15">Week 15</option>
    </select>
    <button class="filter-btn" id="sortBtn" title="Sort by date/time">Sort: Date 🕐</button>
    <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
  </div>
  <div id="matchupsContainer"></div>
</div>
<div class="footer">Skeez CFB Rankings · Weekly Schedule · Projections updated weekly · Built with ❤️</div>
<script>
const API = '/api';
let matchups = [];
let currentWeek = 1;
let activeConf = 'all';
let searchQuery = '';
let sortMode = 'date';
let sortDir = 'asc';

async function fetchSchedule(week) {
  currentWeek = week || currentWeek;
  try {
    const res = await fetch(`${API}/schedule/fetch?week=${currentWeek}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({week: currentWeek})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    matchups = data.matchups;
    document.getElementById('weekBadge').textContent = `Week ${data.week} · ${data.season} Season · ${matchups.length} Games`;
    document.getElementById('weekSelect').value = currentWeek;
    renderSummary(data);
    renderMatchups();
  } catch (err) {
    console.error('Failed to fetch schedule:', err);
    document.getElementById('matchupsContainer').innerHTML =
      '<div style="text-align:center;padding:3rem;color:var(--text-dim)">⚠️ Could not load schedule. Is the backend running?</div>';
  }
}

async function fetchBestBets() {
  try {
    const [bbRes, recRes] = await Promise.all([
      fetch(`${API}/best-bets`),
      fetch(`${API}/best-bets/record`)
    ]);
    const bbData = await bbRes.json();
    const recData = await recRes.json();
    renderBestBets(bbData.best_bets || [], recData);
  } catch (err) {
    console.error('Failed to fetch best bets:', err);
    document.getElementById('bestBets').innerHTML = '';
  }
}

function stars(n) { return '★'.repeat(n || 0) + '☆'.repeat(Math.max(0, 3 - (n || 0))); }

async function fetchLineMoves() {
  try {
    const res = await fetch(`${API}/line-movements`);
    const data = await res.json();
    renderLineMoves(data.movements || []);
  } catch (err) {
    console.error('Failed to fetch line movements:', err);
    document.getElementById('lineMoves').innerHTML = '';
  }
}

function renderLineMoves(movements) {
  const el = document.getElementById('lineMoves');
  if (!movements.length) {
    el.innerHTML = '<h3>📊 Line Movement</h3><div class="lm-empty">No line movement detected since last refresh. Movements appear after a book changes a spread or total between refreshes.</div>';
    return;
  }
  const rows = movements.map(mv => {
    const up = mv.delta > 0;
    const down = mv.delta < 0;
    const cls = up ? 'up' : down ? 'down' : '';
    const arrow = up ? '▲' : down ? '▼' : '—';
    const fmt = v => (typeof v === 'number' ? (v > 0 ? '+' + v : v) : v);
    return `<div class="lm-row">
      <span class="lm-teams">${mv.home} vs ${mv.away}</span>
      <span class="lm-market">${mv.market}</span>
      <span class="lm-edge">${fmt(mv.old)} → ${fmt(mv.new)}</span>
      <span class="lm-delta ${cls}">${arrow} ${fmt(mv.delta)}</span>
    </div>`;
  }).join('');
  el.innerHTML = `
    <h3>📊 Line Movement <span class="lm-edge">(since last refresh)</span></h3>
    ${rows}
  `;
}

function renderBestBets(bets, rec) {
  const el = document.getElementById('bestBets');
  if (!bets.length) { el.innerHTML = ''; return; }
  const spreadStr = rec.spread_str || '0-0';
  const totalStr = rec.total_str || '0-0';
  const rows = bets.map(b => {
    // Show both spread and total picks
    // spread is the HOME team's line (negative = home favored). When the pick is
    // the away underdog, flip the sign and show the away team's name.
    let spreadPick = '<span class="bb-edge">no spread</span>';
    if (b.spread_pick) {
      const isHome = b.spread_pick === 'home';
      const team = isHome ? b.home : b.away;
      const line = isHome ? b.spread : (b.spread != null ? -b.spread : null);
      const lineStr = line == null ? '' : `${line > 0 ? '+' : ''}${line}`;
      spreadPick = `<span class="bb-pick">${team} ${lineStr}</span> <span class="bb-stars">${stars(b.spread_stars)}</span>`;
    }
    const totalPick = b.over_pick
      ? `<span class="bb-pick ${b.over_pick === 'under' ? 'under' : ''}">${b.over_pick.toUpperCase()} ${b.total}</span> <span class="bb-stars">${stars(b.total_stars)}</span>`
      : '<span class="bb-edge">no total</span>';
    return `<div class="bb-row">
      <span class="bb-teams">${b.home} vs ${b.away}</span>
      <span>${spreadPick}</span>
      <span>${totalPick}</span>
    </div>`;
  }).join('');
  el.innerHTML = `
    <h3>🎯 Best Bets <span class="bb-edge">(spread ${spreadStr} · O/U ${totalStr})</span></h3>
    <div class="bb-header" style="display:grid;grid-template-columns:1.4fr auto auto;gap:.75rem;font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;padding-bottom:.25rem;">
      <span>Matchup</span><span>Spread Pick</span><span>O/U Pick</span>
    </div>
    ${rows}
  `;
}

function renderSummary(data) {
  const m = matchups;
  const avgDiff = m.length ? (m.reduce((s, x) => s + Math.abs(x.differential), 0) / m.length).toFixed(1) : 0;
  const blowouts = m.filter(x => Math.abs(x.differential) >= 21).length;
  const close = m.filter(x => Math.abs(x.differential) <= 7).length;
  // Fetch SU + ATS records (async; render placeholders first)
  fetch(`${API}/record`).then(r => r.json()).then(rec => {
    const su = rec.su_str || '0-0';
    const ats = rec.ats_str || '0-0';
    document.getElementById('suCard').innerHTML = `<div class="val ${rec.su.wins > rec.su.losses ? 'good' : ''}">${su}</div><div class="label">Straight-Up</div>`;
    document.getElementById('atsCard').innerHTML = `<div class="val ${rec.ats.wins > rec.ats.losses ? 'good' : ''}">${ats}</div><div class="label">ATS</div>`;
  }).catch(() => {});
  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card record" id="suCard"><div class="val">…</div><div class="label">Straight-Up</div></div>
    <div class="summary-card"><div class="val">${m.length}</div><div class="label">Matchups</div></div>
    <div class="summary-card"><div class="val">${avgDiff}</div><div class="label">Avg Diff</div></div>
    <div class="summary-card"><div class="val">${close}</div><div class="label">Close (≤7)</div></div>
    <div class="summary-card record" id="atsCard"><div class="val">…</div><div class="label">ATS</div></div>
  `;
}

function teamEmoji(name) {
  const map = {
    'Georgia':'🐯','Michigan':'🐺','Ohio State':'🍀','Texas':'🤘','Alabama':'🏴',
    'Oregon':'🦆','LSU':'🐯','Penn State':'🦁','USC':'⭐','Clemson':'🐅',
    'Oklahoma':'⚡','Florida':'🐊','Notre Dame':'🙏','Cincinnati':'🅒',
    'Tennessee':'🚩','Missouri':'🐗','Wisconsin':'🧀','Washington':'🚢',
    'Texas Tech':'🤠','Virginia Tech':'🛡️','Baylor':'🌵','Cal':'🐻',
    'Iowa':'🔨','Maryland':'🦅','Miami':'🌴','Stanford':'🌲','UCLA':'🎬',
    'Kansas':'🐻','NC State':'🐺','Michigan State':'🦅','Ole Miss':'🐻',
    'South Carolina':'🐻','Arkansas':'🐷','Minnesota':'🌲','Oklahoma State':'🤠',
    'TCU':'🔵','BYU':'🎵','Arizona':'🐍','Illinois':'🏠','Rutgers':'🏈',
    'Auburn':'🐘','Kansas State':'🐯','Arizona State':'🌵','Colorado':'🏔️',
    'West Virginia':'🏹','Houston':'🚀','UCF':'🏝️','Buffalo':'🐃'
  };
  return map[name] || '🏈';
}

function diffBadgeClass(m) {
  if (m.differential === 0) return 'pick-em';
  return m.home_favorite ? 'home-fav' : 'away-fav';
}

function diffBadgeText(m) {
  if (m.differential === 0) return 'PICK-EM';
  const fav = m.home_favorite ? m.home : m.away;
  return `${fav} by ${Math.abs(m.differential)}`;
}

function spClass(val) {
  return val >= 0.9 ? 'high' : val >= 0.7 ? '' : 'low';
}

function formatGameDate(dateStr) {
  if (!dateStr) return '—';
  try {
    const d = new Date(dateStr);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    // Convert to ET (UTC-4 or UTC-5) manually for consistency
    const et = new Date(d.getTime() + (d.getTimezoneOffset() - 240) * 60000);
    const m = months[et.getMonth()];
    let day = et.getDate();
    let h = et.getHours();
    const min = et.getMinutes().toString().padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${m} ${day}, ${h}:${min} ${ampm} ET`;
  } catch { return '—'; }
}

function renderMatchups() {
  let data = [...matchups];
  if (activeConf !== 'all') {
    data = data.filter(m => m.home_conf === activeConf || m.away_conf === activeConf);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    data = data.filter(m => m.home.toLowerCase().includes(q) || m.away.toLowerCase().includes(q));
  }
  data.sort((a, b) => {
    if (sortMode === 'date') {
      const da = a.date ? new Date(a.date) : Infinity;
      const db = b.date ? new Date(b.date) : Infinity;
      return sortDir === 'asc' ? da - db : db - da;
    }
    if (sortMode === 'diff') return sortDir === 'desc' ? Math.abs(b.differential) - Math.abs(a.differential) : Math.abs(a.differential) - Math.abs(b.differential);
    if (sortMode === 'home') return sortDir === 'desc' ? b.home_proj - a.home_proj : a.home_proj - b.home_proj;
    if (sortMode === 'away') return sortDir === 'desc' ? b.away_proj - a.away_proj : a.away_proj - b.away_proj;
    return 0;
  });
  const container = document.getElementById('matchupsContainer');
  if (!data.length) {
    container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-dim)">No matchups match your filter.</div>';
    return;
  }
  container.innerHTML = data.map(m => `
    <div class="matchup-card">
      <div class="team-side home">
        <div class="team-logo"><img src="${m.home_logo_url || ''}" alt="${m.home}" onerror="this.style.display='none'"></div>
        <div>
          <div class="team-name">${m.home}${m.ats_pick === 'home' ? '<span class="pick-arrow">▶</span>' : ''}</div>
          <div class="team-meta">
            <span>${m.home_record}</span>
            <span>·</span>
            <span>${m.home_conf}</span>
          </div>
          <div class="sp-row">SP+ <span class="sp-val ${spClass(m.home_sp)}">${m.home_sp.toFixed(2)}</span></div>
        </div>
      </div>
      <div class="vs-section">
        <div class="vs-label">Projected</div>
        <div class="vs-score home">${m.home_proj}</div>
        <div class="vs-score away">${m.away_proj}</div>
        ${m.line_diff !== undefined && m.line_diff !== null
          ? `<div class="line-overlay"><span class="line-spread">${m.line_diff > 0 ? '+' : ''}${m.line_diff}</span><span class="line-total">O/U ${m.line_total ?? ' — '}</span></div>`
          : `<div class="line-overlay"><span class="line-na">No line</span></div>`
        }
        <div class="diff-badge ${diffBadgeClass(m)}">${diffBadgeText(m)}</div>
        <div class="game-date">${formatGameDate(m.date)}</div>
        ${m.line_vs_model !== undefined && m.line_vs_model !== null
          ? `<div class="line-vs-model ${m.line_vs_model > 1 ? 'up' : m.line_vs_model < -1 ? 'down' : ''}">Line ${m.line_vs_model > 0 ? 'covers +' + m.line_vs_model : m.line_vs_model < 0 ? 'under -' + Math.abs(m.line_vs_model) : '≈ model'}</div>`
          : ''
        }
        ${m.over_pick
          ? `<div class="ou-pick ${m.over_pick === 'over' ? 'up' : 'down'}">Model ${m.model_total} → ${m.over_pick.toUpperCase()} ${m.line_total} (${m.total_vs_model > 0 ? '+' : ''}${m.total_vs_model})</div>`
          : ''
        }
      </div>
      <div class="team-side away">
        <div>
          <div class="team-name">${m.ats_pick === 'away' ? '<span class="pick-arrow">◀</span>' : ''}${m.away}</div>
          <div class="team-meta">
            <span>${m.away_record}</span>
            <span>·</span>
            <span>${m.away_conf}</span>
          </div>
          <div class="sp-row">SP+ <span class="sp-val ${spClass(m.away_sp)}">${m.away_sp.toFixed(2)}</span></div>
        </div>
        <div class="team-logo"><img src="${m.away_logo_url || ''}" alt="${m.away}" onerror="this.style.display='none'"></div>
      </div>
    </div>
  `).join('');
}

// ── Events ──
document.getElementById('searchBox').addEventListener('input', e => { searchQuery = e.target.value.trim(); renderMatchups(); });
document.getElementById('weekSelect').addEventListener('change', e => { fetchSchedule(parseInt(e.target.value)); });
document.querySelectorAll('.filter-btn[data-conf]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-conf]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeConf = btn.dataset.conf;
    renderMatchups();
  });
});
document.getElementById('sortBtn').addEventListener('click', () => {
  const modes = ['date', 'diff', 'home', 'away'];
  const labels = ['Date', 'Diff', 'Home Score', 'Away Score'];
  const idx = modes.indexOf(sortMode);
  if (idx < modes.length - 1) { sortMode = modes[idx + 1]; }
  else { sortMode = modes[0]; sortDir = sortDir === 'desc' ? 'asc' : 'desc'; }
  document.getElementById('sortBtn').textContent = `Sort: ${labels[modes.indexOf(sortMode)]} ${sortMode === 'date' ? '🕐' : (sortDir === 'desc' ? '↓' : '↑')}`;
  renderMatchups();
});
document.getElementById('refreshBtn').addEventListener('click', () => fetchSchedule(currentWeek));

// ── Init ──
fetchSchedule(1);
fetchBestBets();
fetchLineMoves();
</script>
</body>
</html>
