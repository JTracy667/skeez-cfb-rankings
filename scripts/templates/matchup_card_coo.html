<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* ── COO · “BROADCAST BOOTH TERMINAL” ─────────────────────────────────────
   Thesis: a Saturday-night broadcast graphic that behaves like an instrument
   panel. Near-black neutral ink (no blue-grey cast) so the two LIVE-sampled
   team accents are the only saturated colour on the card; semantics (good/bad)
   are small, disciplined, and never compete with the accents.
   Contrast law (Jeff, 2026-10-02): every label & value is white or near-white.
   --dim is reserved for footnotes/metadata. Never a metric. */
:root{
  --bg:#0a0b0e;            /* ink — neutral, zero hue */
  --panel:#14161c;         /* elevation 1 */
  --panel2:#191c24;        /* elevation 2 */
  --hair:rgba(255,255,255,.09);
  --hair2:rgba(255,255,255,.05);
  --text:#ffffff;
  --soft:#dfe4ee;          /* secondary — still fully legible */
  --dim:#99a1b3;           /* footnotes ONLY */
  --good:#2ee08a;--good-bg:rgba(46,224,138,.13);
  --bad:#ff7373;--bad-bg:rgba(255,115,115,.13);
  --chip:#b9c2d4;          /* neutral rank chip */
  --chipbg:#333c50;
  --away:{{AWAY_ACCENT}};--home:{{HOME_ACCENT}};
  --away-soft:{{AWAY_SOFT}};--home-soft:{{HOME_SOFT}};
  --away-glow:{{AWAY_GLOW}};--home-glow:{{HOME_GLOW}};
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;padding:22px}
.card{width:1220px;max-width:none;margin:0 auto;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 55% at -5% -12%, var(--away-soft) 0%, transparent 46%),
    radial-gradient(120% 55% at 105% -12%, var(--home-soft) 0%, transparent 46%),
    linear-gradient(180deg,#111319 0%, var(--bg) 34%);
  border:1px solid var(--hair);border-radius:26px;
  box-shadow:0 34px 80px -28px rgba(0,0,0,.85)}

/* ── Top rule: broadcast tick-ruler ── */
.ruler{height:8px;display:flex;justify-content:space-between;padding:0 26px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, transparent 1px 42px);
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);
  mask:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);opacity:.9}

/* ── Topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 30px 0;gap:16px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .dot{width:9px;height:9px;border-radius:50%;
  background:linear-gradient(135deg,var(--away),var(--home));
  box-shadow:0 0 12px 1px rgba(255,255,255,.25)}
.brand span{font-size:11.5px;font-weight:800;letter-spacing:.34em;color:var(--text);
  text-transform:uppercase;white-space:nowrap}
.src{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:right}

/* ── HERO ── */
.hero{position:relative;margin:14px 26px 0;border-radius:20px;
  border:1px solid var(--hair);
  background:linear-gradient(100deg, var(--away-soft) 0%, rgba(10,11,14,.72) 34%,
              rgba(10,11,14,.72) 66%, var(--home-soft) 100%), var(--panel);
  overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 4px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--away) 0%, #2a2f3d 46%, #2a2f3d 54%, var(--home) 100%)}
.teams{position:relative;display:grid;grid-template-columns:1fr minmax(280px,340px) 1fr;
  gap:8px;align-items:center;padding:20px 28px 16px}
.team{display:flex;align-items:center;gap:18px;min-width:0}
.team.home{flex-direction:row-reverse;text-align:right}
.logo-ring{width:88px;height:88px;flex:0 0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(circle at 50% 38%, rgba(255,255,255,.09) 0%, transparent 72%)}
.team.away .logo-ring{box-shadow:0 0 0 2px var(--away),0 0 34px 3px var(--away-glow), inset 0 0 0 6px rgba(0,0,0,.35)}
.team.home .logo-ring{box-shadow:0 0 0 2px var(--home),0 0 34px 3px var(--home-glow), inset 0 0 0 6px rgba(0,0,0,.35)}
.logo{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.65))}
.tinfo{display:flex;flex-direction:column;gap:5px;min-width:0}
.side-k{font-size:10px;font-weight:800;letter-spacing:.3em}
.team.away .side-k{color:var(--away)}
.team.home .side-k{color:var(--home)}
.tname{font-size:30px;font-weight:900;letter-spacing:-.015em;line-height:1.04;
  color:#fff;text-transform:uppercase;overflow-wrap:anywhere}
.trec{font-size:13px;font-weight:700;color:var(--soft);letter-spacing:.06em}
.probs{display:flex;gap:8px;margin-top:7px}
.team.home .probs{justify-content:flex-end}
.probs div{background:rgba(10,11,14,.62);border:1px solid var(--hair);
  border-radius:10px;padding:7px 14px;text-align:center;min-width:92px}
.probs .k{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--soft);
  font-weight:800;margin-bottom:2px}
.probs .v{display:block;font-size:19px;font-weight:900;color:#fff;line-height:1.15}
.probs .v.lead{color:var(--good)}

/* ── CENTRE HERO BLOCK: the line is the story ── */
.center{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.vs{font-size:13px;font-weight:800;letter-spacing:.5em;color:var(--soft);
  text-indent:.5em;line-height:1}
.linebox{width:100%;text-align:center;border-radius:16px;padding:12px 16px 10px;
  background:rgba(10,11,14,.66);border:1px solid var(--hair);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  font-size:21px;font-weight:900;color:#fff;line-height:1.7}
.linebox .k{display:inline-block;font-size:10px;letter-spacing:.3em;font-weight:800;
  color:var(--soft);text-transform:uppercase;margin:0 3px}
.wx{font-size:12.5px;font-weight:800;color:var(--soft);letter-spacing:.14em;
  text-transform:uppercase;text-align:center}

/* ── BODY GRID ── */
.body{display:grid;grid-template-columns:1fr 1.42fr 1fr;gap:16px;align-items:start;
  padding:16px 26px 2px}
.col{min-width:0;background:var(--panel);border:1px solid var(--hair);border-radius:18px;
  padding:8px 14px 4px;position:relative;overflow:hidden}
.col::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.col.away::before{background:linear-gradient(90deg,var(--away),transparent)}
.col.home::before{background:linear-gradient(270deg,var(--home),transparent)}
.mid{min-width:0}
.secttl{font-size:10px;letter-spacing:.24em;color:var(--soft);text-transform:uppercase;
  font-weight:800;margin:8px 0 2px;display:flex;align-items:center;gap:10px}
.secttl::after{content:"";flex:1;height:1px;background:var(--hair2)}
.col .secttl:first-child{margin-top:2px}

/* side stacks */
.srow{display:flex;align-items:center;gap:7px;padding:0.5px 2px;
  border-bottom:1px solid var(--hair2);font-size:12px;line-height:1.35}
.srow:last-child{border-bottom:none}
.slabel{color:var(--text);font-weight:650;flex:1 1 auto;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.srow.home{flex-direction:row-reverse}
.srow.home .slabel{text-align:right}
.sval{color:#fff;font-weight:850;font-variant-numeric:tabular-nums;flex:0 0 auto;
  font-size:13px;min-width:50px;text-align:right}
.srow.home .sval{text-align:left}
.sval.lead{color:var(--good)}
.sval.good{background:var(--good-bg);border-radius:6px;padding:1px 7px}
.sval.bad{background:var(--bad-bg);border-radius:6px;padding:1px 7px}

/* rank chip — square, instrument-panel */
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:28px;
  height:18px;padding:0 5px;border-radius:5px;font-size:10px;font-weight:850;
  color:#0b0d13;background:#7fb2ff;flex:0 0 auto;font-variant-numeric:tabular-nums}
.rk.good{background:#7fb2ff}
.rk.bad{background:var(--bad)}
.rk.mid{background:var(--chipbg);color:var(--chip)}

/* centre tables */
section{margin:0 0 12px}
h2{font-size:11px;letter-spacing:.2em;color:var(--text);text-transform:uppercase;
  font-weight:850;margin:0 0 6px;display:flex;align-items:center;gap:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2::after{content:"";flex:1;height:1px;background:var(--hair2)}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
td{padding:3.5px 8px;border-bottom:1px solid var(--hair2);vertical-align:middle}
tr:last-child td{border-bottom:none}
.label{text-align:center;color:var(--text);font-size:10.5px;font-weight:750;
  letter-spacing:.02em;white-space:normal;line-height:1.3;overflow:hidden;width:46%}
.val{font-variant-numeric:tabular-nums;white-space:nowrap;width:27%;
  color:#fff;font-size:14px;font-weight:850}
.val.away{text-align:right}
.val.home{text-align:left}
.val.good{background:var(--good-bg);box-shadow:inset 3px 0 0 var(--good)}
.val.home.good{box-shadow:inset -3px 0 0 var(--good)}
.val.bad{background:var(--bad-bg);box-shadow:inset 3px 0 0 var(--bad)}
.val.home.bad{box-shadow:inset -3px 0 0 var(--bad)}
.val.away.lead{box-shadow:inset 3px 0 0 var(--away);background:rgba(255,255,255,.03)}
.val.home.lead{box-shadow:inset -3px 0 0 var(--home);background:rgba(255,255,255,.03)}
.val.lead{color:var(--good)}

/* ── FOOTER: legend as a full-width base strip ── */
.foot{margin:12px 26px 0;border-top:1px solid var(--hair);padding:10px 6px 6px}
.foot h2{font-size:10px;letter-spacing:.3em;color:var(--soft);margin:0 0 6px}
.foot h2::after{background:var(--hair2)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px}
.lg{display:flex;align-items:flex-start;gap:9px;font-size:11px;color:var(--soft);line-height:1.35}
.sw{width:13px;height:13px;border-radius:4px;flex:0 0 auto;margin-top:1px;border:1px solid var(--hair)}
.sw.good{background:var(--good-bg);border-color:var(--good)}
.sw.pill{background:#7fb2ff;border-color:#7fb2ff;border-radius:5px}
.sw.none{background:transparent;border-style:dashed;border-color:#5a6478}
</style></head><body><div class="card">

<div class="ruler"></div>

<div class="topbar">
  <div class="brand"><span class="dot"></span><span>SKEEZ · ADVANCED MATCHUP</span></div>
  <div class="src">{{TITLE}}</div>
</div>

<div class="hero">
  <div class="teams">
    <div class="team away">
      <div class="logo-ring"><img class="logo" src="{{AWAY_LOGO}}" alt="{{AWA}}"></div>
      <div class="tinfo">
        <div class="side-k">AWAY</div>
        <div class="tname">{{AWA}}</div>
        <div class="trec">{{AWAY_REC}}</div>
        <div class="probs">
          <div><span class="k">WIN PROB</span><span class="v {{AWAY_WP_LEAD}}">{{AWAY_WP}}</span></div>
          <div><span class="k">PROJ PTS</span><span class="v {{AWAY_PP_LEAD}}">{{AWAY_PP}}</span></div>
        </div>
      </div>
    </div>
    <div class="center">
      <div class="vs">VS</div>
      <div class="linebox">{{LINES}}</div>
      <div class="wx">{{WEATHER}}</div>
    </div>
    <div class="team home">
      <div class="logo-ring"><img class="logo" src="{{HOME_LOGO}}" alt="{{HOM}}"></div>
      <div class="tinfo">
        <div class="side-k">HOME</div>
        <div class="tname">{{HOM}}</div>
        <div class="trec">{{HOME_REC}}</div>
        <div class="probs">
          <div><span class="k">WIN PROB</span><span class="v {{HOME_WP_LEAD}}">{{HOME_WP}}</span></div>
          <div><span class="k">PROJ PTS</span><span class="v {{HOME_PP_LEAD}}">{{HOME_PP}}</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="body">
  <div class="col away">{{AWAY_STACK}}</div>
  <div class="mid">{{CROSS}}{{RATINGS}}</div>
  <div class="col home">{{HOME_STACK}}</div>
</div>

<div class="foot">{{LEGEND}}</div>

</div></body></html>
