<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* Palette rule (Jeff, 2026-10-02): label/text contrast is non-negotiable.
   NEVER grey-on-dark for a label or a value. --dim is for footnotes ONLY.
   COLOR SCHEME: adopted from Research's matchup_card_research.html (Jeff, 2026-10-03).
   The two team accents are SAMPLED LIVE from each team's own logo (team_accent() ->
   _dominant_color_rgb in matchup_report.py), so the card re-themes per matchup and is
   never a fixed palette. Pillow is optional: no Pillow / no logo -> neutral fallback. */
:root{
  --bg:#060709;--surface:#12151f;--surface2:#171b28;--border:#2b3346;
  --text:#ffffff;--dim:#aab3c9;--accent:#8fb8ff;--good:#3ddc84;--bad:#ff6b6b;
  --row-alt:#0e1119;
  --away:{{AWAY_ACCENT}};--home:{{HOME_ACCENT}};
  --away-soft:{{AWAY_SOFT}};--home-soft:{{HOME_SOFT}};
  --away-glow:{{AWAY_GLOW}};--home-glow:{{HOME_GLOW}};
}
*{box-sizing:border-box}
body{margin:0;
  background:
    radial-gradient(circle at 12% -8%, var(--away-soft) 0%, transparent 42%),
    radial-gradient(circle at 88% -8%, var(--home-soft) 0%, transparent 42%),
    radial-gradient(circle at 50% 110%, #141a2c 0%, var(--bg) 60%),
    var(--bg);
  color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:22px}
.card{max-width:1280px;margin:0 auto;background:linear-gradient(180deg,#141828 0%,var(--surface) 100%);
  border:1px solid var(--border);border-radius:22px;padding:0 0 12px;overflow:hidden;
  box-shadow:0 30px 70px -24px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.02) inset}

/* ── Hero band: team-coloured wash, with an away→home rule along its base ── */
.hero{position:relative;padding:14px 22px 12px;
  background:linear-gradient(115deg, var(--away-soft) 0%, rgba(20,24,38,0) 38%,
              rgba(20,24,38,0) 62%, var(--home-soft) 100%);
  border-bottom:1px solid var(--border)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg, var(--away) 0%, #2b3346 50%, var(--home) 100%)}
.topbar{display:flex;justify-content:center;align-items:baseline;margin-bottom:4px}
.tr{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.16em;text-transform:uppercase;
  background:rgba(143,184,255,.12);padding:4px 10px;border-radius:999px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:8px}
.team{display:flex;align-items:center;gap:12px}
.team.home{flex-direction:row-reverse;text-align:right}
.logo-ring{width:62px;height:62px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 70%)}
.team.away .logo-ring{box-shadow:0 0 0 2px var(--away), 0 0 22px 2px var(--away-glow)}
.team.home .logo-ring{box-shadow:0 0 0 2px var(--home), 0 0 22px 2px var(--home-glow)}
.logo{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
.tinfo{display:flex;flex-direction:column;gap:2px}
.tname{font-size:17px;font-weight:900;color:#fff;letter-spacing:.01em}
.trec{font-size:11.5px;color:var(--dim);font-weight:700}
.statbox{display:flex;gap:8px;margin-top:5px}
.team.home .statbox{justify-content:flex-end}
.statbox div{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:9px;
  padding:5px 12px;text-align:center;min-width:84px}
.statbox .k{display:block;font-size:9px;letter-spacing:.09em;color:var(--dim);font-weight:800}
.statbox .v{display:block;font-size:18px;font-weight:900;color:#fff}
.statbox .v.lead{color:var(--good)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:270px}
.vs{font-size:26px;font-weight:900;color:#fff;letter-spacing:.18em;line-height:1}
.wx{font-size:13.5px;font-weight:700;color:#fff;letter-spacing:.02em;text-align:center}
.linebox{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;
  padding:10px 18px;text-align:center;font-size:16.5px;color:#fff;font-weight:800;line-height:1.6;min-width:230px}
.linebox .k{color:var(--dim);font-weight:800;letter-spacing:.06em;font-size:10.5px;margin-right:4px}

/* ── Three-column body ── */
.cols{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:16px;align-items:start;
  padding:0 22px;margin-top:2px}
.col{display:flex;flex-direction:column;min-width:0}
.secttl{font-size:10.5px;letter-spacing:.09em;color:var(--accent);text-transform:uppercase;
  font-weight:800;margin:9px 0 2px;text-align:center}
.srow{display:flex;align-items:center;gap:7px;font-size:12px;padding:2.5px 2px;
  border-bottom:1px solid rgba(255,255,255,.05)}
.col.away .srow{flex-direction:row}
.col.home .srow{flex-direction:row-reverse}
.slabel{color:#ffffff;font-weight:600;flex:1 1 auto;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.col.away .slabel{text-align:left}
.col.home .slabel{text-align:right}
.sval{color:#ffffff;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto;
  min-width:46px;padding:1px 4px;border-radius:5px}
.col.away .sval{text-align:right}
.col.home .sval{text-align:left}
.sval.good{background:rgba(61,220,132,.16)}
.sval.bad{background:rgba(255,107,107,.16)}
.sval.lead{color:var(--good)}
/* ── Centre cross tables + reference ratings ── */
.mid{min-width:0}
.mid h2{justify-content:center;gap:10px;margin:14px 0 4px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
tr:nth-child(even) td{background:var(--row-alt)}
td{padding:4px 7px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
.label{text-align:center;color:#ffffff;font-size:11.5px;font-weight:700;
  letter-spacing:.02em;white-space:nowrap;width:34%}
.val{font-variant-numeric:tabular-nums;white-space:nowrap;width:33%;
  color:#ffffff;font-size:13.5px;font-weight:800;border-radius:8px}
.val.away{text-align:left;border-left:3px solid transparent}
.val.home{text-align:right;border-right:3px solid transparent}
.val.good{background:rgba(61,220,132,.16)}
.val.bad{background:rgba(255,107,107,.16)}
.val.away.lead{border-left-color:var(--away)}
.val.home.lead{border-right-color:var(--home)}
.val.lead{color:var(--good)}
h2{font-size:11.5px;letter-spacing:.07em;color:#fff;text-transform:uppercase;
  display:flex;justify-content:space-between;font-weight:800;margin:16px 0 6px}
.rk{display:inline-block;min-width:27px;text-align:center;font-size:10.5px;color:#0b0d13;
  background:#93c5fd;border-radius:999px;padding:1.5px 6px;margin:0 7px;font-weight:800;flex:0 0 auto}
.rk.bad{background:#fca5a5}
.rk.mid{background:#3a4459;color:#e8edf7;font-weight:700}
/* ── Legend + reference ratings ── */
.legend{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.lg{display:flex;align-items:center;gap:9px;font-size:11.5px;color:#ffffff;line-height:1.35}
.sw{width:15px;height:15px;border-radius:4px;flex:0 0 auto;border:1px solid var(--border)}
.sw.good{background:rgba(61,220,132,.42);border-color:var(--good)}
.sw.pill{background:#93c5fd;border-color:#93c5fd;border-radius:999px}
.sw.none{background:transparent;border-style:dashed;border-color:#556080}
.note{color:var(--dim);font-size:11px;margin-top:6px}
.note b{color:#ffffff}
</style></head><body><div class="card">

<div class="hero">
  <div class="topbar"><span class="tr">Advanced Stats Preview</span></div>
  <div class="teams">
    <div class="team away">
      <div class="logo-ring"><img class="logo" src="{{AWAY_LOGO}}" alt="{{AWA}}"></div>
      <div class="tinfo"><div class="tname">{{AWA}}</div><div class="trec">{{AWAY_REC}}</div>
        <div class="statbox">
          <div><span class="k">WIN PROB</span><span class="v {{AWAY_WP_LEAD}}">{{AWAY_WP}}</span></div>
          <div><span class="k">PROJ PTS</span><span class="v {{AWAY_PP_LEAD}}">{{AWAY_PP}}</span></div>
        </div>
      </div>
    </div>
    <div class="center"><div class="vs">VS</div>
      <div class="wx">{{WEATHER}}</div>
      <div class="linebox">{{LINES}}</div></div>
    <div class="team home">
      <div class="logo-ring"><img class="logo" src="{{HOME_LOGO}}" alt="{{HOM}}"></div>
      <div class="tinfo"><div class="tname">{{HOM}}</div><div class="trec">{{HOME_REC}}</div>
        <div class="statbox">
          <div><span class="k">WIN PROB</span><span class="v {{HOME_WP_LEAD}}">{{HOME_WP}}</span></div>
          <div><span class="k">PROJ PTS</span><span class="v {{HOME_PP_LEAD}}">{{HOME_PP}}</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="cols">
  <div class="col away">{{AWAY_STACK}}</div>
  <div class="mid">{{CROSS}}{{RATINGS}}{{LEGEND}}</div>
  <div class="col home">{{HOME_STACK}}</div>
</div>
</div></body></html>
