<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* Palette rule (Jeff, 2026-10-02): label/text contrast is non-negotiable.
   NEVER grey-on-dark for labels or values. Both reference cards use
   high-contrast text (white on dark / near-black on light) plus colored
   rank pills and red/green heat cells. --dim is for footnotes ONLY.
   WIDE layout (Jeff, 2026-10-02): the reference is a landscape graphic --
   away stat stack | cross tables | home stat stack -- and a narrow tower is
   unusable when shared to a phone. Keep the card landscape. */
:root{--bg:#0b0d13;--surface:#151a26;--border:#2b3346;--text:#ffffff;--dim:#c9d1e0;
--accent:#8fb8ff;--good:#3ddc84;--bad:#ff9a9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px}
.card{max-width:1280px;margin:0 auto;background:var(--surface);border:1px solid var(--border);
border-radius:16px;padding:16px 20px 10px}
.topbar{display:flex;justify-content:center;align-items:baseline;
border-bottom:1px solid var(--border);padding-bottom:9px}
.tr{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.18em;text-transform:uppercase}
/* team header */
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;
padding:12px 0 10px;border-bottom:1px solid var(--border)}
.team{display:flex;align-items:center;gap:12px}
.team.home{flex-direction:row-reverse;text-align:right}
.logo{width:54px;height:54px;object-fit:contain;flex:0 0 auto}
.tinfo{display:flex;flex-direction:column;gap:2px}
.tname{font-size:17px;font-weight:800;color:#fff}
.trec{font-size:11.5px;color:var(--dim);font-weight:600}
.statbox{display:flex;gap:8px;margin-top:4px}
.team.home .statbox{justify-content:flex-end}
.statbox div{background:#1d2434;border:1px solid var(--border);border-radius:8px;
padding:5px 12px;text-align:center;min-width:84px}
.statbox .k{display:block;font-size:9px;letter-spacing:.09em;color:var(--dim);font-weight:700}
.statbox .v{display:block;font-size:18px;font-weight:800;color:#fff}
.statbox .v.lead{color:var(--good)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:8px;padding-top:2px;min-width:300px}
.vs{font-size:26px;font-weight:900;color:#ffffff;letter-spacing:.18em;line-height:1}
.wx{font-size:14px;font-weight:700;color:#ffffff;letter-spacing:.02em;text-align:center}
.linebox{background:#1d2434;border:1px solid var(--border);border-radius:10px;
padding:11px 20px;text-align:center;font-size:17px;color:#fff;font-weight:800;
line-height:1.6;min-width:260px}
.linebox .k{color:var(--accent);font-weight:800;letter-spacing:.08em;font-size:12px;
vertical-align:2px}
/* three-column body */
.cols{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:16px;align-items:start;margin-top:2px}
.col{display:flex;flex-direction:column;min-width:0}
.secttl{font-size:10.5px;letter-spacing:.09em;color:var(--accent);text-transform:uppercase;
font-weight:800;margin:9px 0 2px;text-align:center}
.srow{display:flex;align-items:center;gap:7px;font-size:12px;padding:2.5px 2px;
border-bottom:1px solid rgba(255,255,255,.06)}
.col.away .srow{flex-direction:row}
.col.home .srow{flex-direction:row-reverse}
.slabel{color:#ffffff;font-weight:600;flex:1 1 auto;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis}
.col.away .slabel{text-align:left}
.col.home .slabel{text-align:right}
.sval{color:#ffffff;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto;
min-width:46px;padding:1px 4px;border-radius:5px}
.col.away .sval{text-align:right}
.col.home .sval{text-align:left}
.sval.good{background:rgba(34,197,94,.20)}
.sval.bad{background:rgba(239,68,68,.20)}
.sval.lead{color:var(--good)}
/* centre cross tables */
.mid{min-width:0}
.mid h2{justify-content:center;gap:10px;margin:14px 0 4px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:4px 7px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle}
.label{text-align:center;color:#ffffff;font-size:11.5px;font-weight:600;
letter-spacing:.03em;white-space:nowrap;width:34%}
.val{font-variant-numeric:tabular-nums;white-space:nowrap;width:33%;
color:#ffffff;font-size:13.5px;font-weight:700;border-radius:6px}
.val.away{text-align:left}
.val.home{text-align:right}
.val.good{background:rgba(34,197,94,.20)}
.val.bad{background:rgba(239,68,68,.20)}
.val.lead{color:var(--good)}
h2{font-size:11.5px;letter-spacing:.09em;color:var(--accent);text-transform:uppercase;
display:flex;justify-content:space-between;font-weight:800;margin:16px 0 6px}
.rk{display:inline-block;min-width:27px;text-align:center;font-size:10.5px;color:#0b0d13;
background:#93c5fd;border-radius:999px;padding:1.5px 6px;margin:0 7px;font-weight:800;flex:0 0 auto}
.rk.bad{background:#fca5a5}
.rk.mid{background:#3a4459;color:#e8edf7;font-weight:700}
/* legend + reference ratings — fills the centre column's dead space */
.legend{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.lg{display:flex;align-items:center;gap:9px;font-size:11.5px;color:#ffffff;line-height:1.35}
.sw{width:15px;height:15px;border-radius:4px;flex:0 0 auto;border:1px solid var(--border)}
.sw.good{background:rgba(34,197,94,.38);border-color:#22c55e}
.sw.pill{background:#93c5fd;border-color:#93c5fd;border-radius:999px}
.sw.none{background:transparent;border-style:dashed;border-color:#556080}
.note{color:var(--dim);font-size:11px;margin-top:6px}
.note b{color:#ffffff}
.foot{color:var(--dim);font-size:11px;margin-top:14px;border-top:1px solid var(--border);padding-top:9px}
</style></head><body><div class="card">
<div class="topbar"><span class="tr">Advanced Stats Preview</span></div>
<div class="teams">
  <div class="team away">
    <img class="logo" src="{{AWAY_LOGO}}" alt="{{AWA}}">
    <div class="tinfo"><div class="tname">{{AWA}}</div><div class="trec">{{AWAY_REC}}</div>
      <div class="statbox">
        <div><span class="k">WIN PROB</span><span class="v {{AWAY_WP_LEAD}}">{{AWAY_WP}}</span></div>
        <div><span class="k">PROJ PTS</span><span class="v {{AWAY_PP_LEAD}}">{{AWAY_PP}}</span></div>
      </div>
    </div>
  </div>
  <div class="center"><div class="vs">VS</div>
    <div class="wx">{{WEATHER}}</div>
    <div class="linebox">{{LINES}}</div></div>
  <div class="team home">
    <img class="logo" src="{{HOME_LOGO}}" alt="{{HOM}}">
    <div class="tinfo"><div class="tname">{{HOM}}</div><div class="trec">{{HOME_REC}}</div>
      <div class="statbox">
        <div><span class="k">WIN PROB</span><span class="v {{HOME_WP_LEAD}}">{{HOME_WP}}</span></div>
        <div><span class="k">PROJ PTS</span><span class="v {{HOME_PP_LEAD}}">{{HOME_PP}}</span></div>
      </div>
    </div>
  </div>
</div>
<div class="cols">
  <div class="col away">{{AWAY_STACK}}</div>
  <div class="mid">{{CROSS}}{{RATINGS}}{{LEGEND}}</div>
  <div class="col home">{{HOME_STACK}}</div>
</div>
</div></body></html>
